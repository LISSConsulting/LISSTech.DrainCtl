openapi: "3.1.0"
info:
  title: LISSTech DrainCtl Dashboard API
  description: |
    REST API for the LISSTech DrainCtl dashboard — monitors Remote Desktop
    Session Host drain mode, session utilization, and server performance.
  version: "1.0.0"
  contact:
    name: LISS Technologies
    url: https://lisstech.com
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Dashboard server (relative)

tags:
  - name: health
    description: Public health check
  - name: auth
    description: Authentication (SSPI Negotiate + credential login)
  - name: servers
    description: Registered server state
  - name: settings
    description: Dashboard configuration
  - name: agent
    description: Machine-to-machine (agent registration and reporting)
  - name: history
    description: Per-server event history (deprecated — use `audit` + `metrics`)
  - name: metrics
    description: Per-host time-series metrics
  - name: audit
    description: Drain-mode change audit trail (time-range query, cursor pagination)
  - name: maintenance
    description: Background maintenance job status (aggregator, retention, one-shot startup jobs)
  - name: notifications
    description: Notification target testing

components:
  securitySchemes:
    negotiate:
      type: http
      scheme: negotiate
      description: SSPI Negotiate (Kerberos/NTLM) — multi-leg handshake via Authorization header.
    session:
      type: apiKey
      in: cookie
      name: drainctl_session
      description: Session cookie issued after successful authentication. 8-hour inactivity timeout.
    machineSSPI:
      type: http
      scheme: negotiate
      description: SSPI Negotiate restricted to machine accounts (hostname ending in `$`).

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

    SessionSummary:
      type: object
      properties:
        active_sessions:
          type: integer
        disconnected_sessions:
          type: integer
        total_sessions:
          type: integer
        max_sessions:
          type: integer
        utilization_pct:
          type: integer
          description: "Percentage of max sessions in use (0–100)."

    PerfSnapshot:
      type: object
      properties:
        cpu_pct:
          type: number
          format: double
          description: "Average CPU utilization across samples."
        cpu_p95_pct:
          type: number
          format: double
          description: "95th percentile CPU utilization across samples."
        mem_avail_mb:
          type: number
          format: double
        mem_total_mb:
          type: number
          format: double
        pages_sec:
          type: number
          format: double
        disk_queue:
          type: number
          format: double
        tcp_retrans_sec:
          type: number
          format: double
        input_delay_p50_ms:
          type: number
          format: double
        input_delay_p95_ms:
          type: number
          format: double
        input_delay_max_ms:
          type: number
          format: double
        session_cpu_p95_pct:
          type: number
          format: double
          description: "Per-session CPU P95 % (omitted when zero)."
        session_cpu_p50_pct:
          type: number
          format: double
          description: "Per-session CPU P50 % (omitted when zero)."
        session_mem_p95_bytes:
          type: number
          format: double
          description: "Per-session working set P95 in bytes (omitted when zero)."
        session_mem_p50_bytes:
          type: number
          format: double
          description: "Per-session working set P50 in bytes (omitted when zero)."
        rfx_available:
          type: boolean
          description: "True when RemoteFX counters were collected this poll cycle."
        rfx_fps_out:
          type: number
          format: double
          description: "RemoteFX output FPS P95."
        rfx_fps_out_p50:
          type: number
          format: double
          description: "RemoteFX output FPS P50."
        rfx_skip_server_sec:
          type: number
          format: double
          description: "RemoteFX frames skipped/sec (server) P95."
        rfx_skip_server_sec_p50:
          type: number
          format: double
          description: "RemoteFX frames skipped/sec (server) P50."
        rfx_skip_net_sec:
          type: number
          format: double
          description: "RemoteFX frames skipped/sec (network) P95."
        rfx_skip_net_sec_p50:
          type: number
          format: double
          description: "RemoteFX frames skipped/sec (network) P50."
        rfx_encode_ms:
          type: number
          format: double
          description: "RemoteFX encode time P95 (ms)."
        rfx_encode_ms_p50:
          type: number
          format: double
          description: "RemoteFX encode time P50 (ms)."
        rfx_quality_pct:
          type: number
          format: double
          description: "RemoteFX frame quality P95 %."
        rfx_quality_pct_p50:
          type: number
          format: double
          description: "RemoteFX frame quality P50 %."
        rfx_rtt_ms:
          type: number
          format: double
          description: "RemoteFX TCP round-trip time P95 (ms)."
        rfx_rtt_ms_p50:
          type: number
          format: double
          description: "RemoteFX TCP round-trip time P50 (ms)."
        rfx_loss_pct:
          type: number
          format: double
          description: "RemoteFX loss rate P95 %."
        rfx_loss_pct_p50:
          type: number
          format: double
          description: "RemoteFX loss rate P50 %."

    CheckResult:
      type: object
      properties:
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        host:
          type: string
        drain_mode:
          type: string
          description: "Human-readable drain mode label."
        drain_mode_value:
          type: integer
          description: "Raw TSServerDrainMode registry value."
        grace_period_seconds:
          type: integer
        state_since:
          type: string
          format: date-time
          nullable: true
        state_duration_seconds:
          type: number
          nullable: true
        status:
          type: string
          enum: [Healthy, Grace, Alert]
        connections_allowed:
          type: boolean
          nullable: true
        transition:
          type: boolean
        transition_from:
          type: string
        changed_by:
          type: string
        sessions:
          $ref: "#/components/schemas/SessionSummary"
          nullable: true
        performance:
          $ref: "#/components/schemas/PerfSnapshot"
          nullable: true
        message:
          type: string
        exit_code:
          type: integer

    ServerView:
      type: object
      properties:
        host:
          type: string
        status:
          type: string
          enum: [ok, warning, grace, alert, "off"]
          description: "Composite status. `warning` = perf threshold warning. `off` = no report in 10 minutes."
        drain_mode:
          type: string
        sessions:
          type: integer
        sessions_active:
          type: integer
        sessions_disconnected:
          type: integer
        max_sessions:
          type: integer
        state_duration_seconds:
          type: number
          nullable: true
        state_changed_at:
          type: string
          format: date-time
          nullable: true
          description: "ISO timestamp when the current state began."
        version:
          type: string
        registered_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        changed_by:
          type: string
        grace_deadline:
          type: string
          format: date-time
          nullable: true
        perf:
          $ref: "#/components/schemas/PerfSnapshot"
          nullable: true

    MetricsSeries:
      type: object
      properties:
        t:
          type: array
          items:
            type: integer
            format: int64
          description: "Unix-ms timestamps, parallel to avg/min/max."
        avg:
          type: array
          items:
            type: number
            format: double
        min:
          type: array
          items:
            type: number
            format: double
        max:
          type: array
          items:
            type: number
            format: double
      required: [t, avg, min, max]

    MetricsResponse:
      type: object
      properties:
        host:
          type: string
        tier:
          type: string
          enum: [raw, 5min, hourly]
          description: "Tier the server actually served. May differ from the requested resolution when `auto` was used or the finer tier has been purged (FR-019)."
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        oldest_available:
          type: string
          format: date-time
          nullable: true
          description: "Oldest timestamp at which the chosen tier holds data for this host. null when the tier is empty."
        newest_available:
          type: string
          format: date-time
          nullable: true
          description: "Newest timestamp at which the chosen tier holds data for this host. null when the tier is empty."
        series:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MetricsSeries"
          description: "Per-counter time-series. Empty map when the tier holds no rows for the requested window (empty-state shape — FR-019a)."
      required: [host, tier, from, to, oldest_available, newest_available, series]

    HistoryView:
      type: object
      deprecated: true
      description: "Legacy shape returned by the removed in-memory history ring. Retained for schema completeness; no endpoint returns this body after v26.107."
      properties:
        timestamp:
          type: string
          format: date-time
        host:
          type: string
        status:
          type: string
          enum: [ok, grace, alert, "off"]
        drain_mode:
          type: string
        state_duration_seconds:
          type: number
          nullable: true
        transition:
          type: boolean
        transition_from:
          type: string
        changed_by:
          type: string
        version:
          type: string
        message:
          type: string
        sessions:
          $ref: "#/components/schemas/SessionSummary"
          nullable: true
        performance:
          $ref: "#/components/schemas/PerfSnapshot"
          nullable: true

    AuditRecord:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: "Event timestamp in UTC (ms precision)."
        host:
          type: string
        prev_state:
          type: integer
          description: "Prior drain mode enum value."
        prev_state_label:
          type: string
          description: "Human-readable label for `prev_state`."
        new_state:
          type: integer
          description: "New drain mode enum value."
        new_state_label:
          type: string
          description: "Human-readable label for `new_state`."
        principal:
          type: string
          description: "Windows principal that caused the change. Empty string for reconciliation rows (FR-001a)."
        changed_by:
          type: string
          description: "Display name of the actor (may equal `principal`)."
        reason:
          type: string
          description: "Optional human reason. For reconciliation rows, carries the drift summary."
        key_modified_ts:
          type: string
          format: date-time
          nullable: true
          description: "Registry key LastWriteTime if known; null for reconciliation rows."
        reconciliation:
          type: boolean
          description: "True when the row was synthesized during startup drift reconciliation (FR-001a)."
        before_ts:
          type: string
          format: date-time
          description: "Only present when `reconciliation=true`. Timestamp of the last known audit row before the drift was observed."
      required:
        [ts, host, prev_state, prev_state_label, new_state, new_state_label, principal, changed_by, reason, key_modified_ts, reconciliation]

    AuditResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
          description: "Ordered by `ts DESC`."
        next_cursor:
          type: string
          nullable: true
          description: "Opaque cursor for the next page; null when no more results. Bound to the filter set — reusing a cursor with a different filter yields `invalid_cursor`."
        tier:
          type: string
          const: audit
          description: "Constant `\"audit\"`; future-proofs alongside `/metrics` which varies tier."
        total_returned:
          type: integer
          description: "Equals `len(records)`."
      required: [records, next_cursor, tier, total_returned]

    MaintenanceJob:
      type: object
      properties:
        name:
          type: string
          description: "Job identifier. Known names: `aggregator_5min`, `aggregator_hourly`, `retention`, `jsonl_migration`, `drift_reconciliation`. New names may appear without client changes."
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
        outcome:
          type: string
          enum: [success, failure, skipped]
        reason:
          type: string
          description: "Non-empty on failure."
        rows_affected:
          type: integer
          format: int64
          description: "For aggregators: rows inserted. For retention: rows deleted."
        overdue:
          type: boolean
          description: "True when `expected_interval_seconds > 0` AND `server_time - finished > 2 * expected_interval_seconds` (FR-031). One-shot startup jobs report `expected_interval_seconds = 0` and are never overdue."
        expected_interval_seconds:
          type: integer
          format: int64
          description: "Server-side config echo. `0` = one-shot startup job (never overdue). Never null — use `0` as the sentinel."
      required:
        [name, started, finished, duration_ms, outcome, reason, rows_affected, overdue, expected_interval_seconds]

    MaintenanceStatusResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceJob"
        server_time:
          type: string
          format: date-time
          description: "Lets clients compute freshness independently of clock skew."
      required: [jobs, server_time]

    Trigger:
      type: string
      enum:
        - drain_on
        - drain_off
        - grace_entered
        - alert
        - healthy
        - session_warning
        - cpu_warning
        - cpu_critical
        - input_delay_warning
        - input_delay_critical
        - memory_warning
        - memory_critical

    NotificationTarget:
      type: object
      properties:
        type:
          type: string
          enum: [webhook, ntfy, email]
        url:
          type: string
          format: uri
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/Trigger"
          description: "Empty = default triggers (drain_on, drain_off, alert, healthy)."
        repeat_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: "0 = fire once per incident. Max 10080 (1 week)."
        secret:
          type: string
          description: "HMAC-SHA256 signing secret (webhooks) or SMTP password (email)."
        to:
          type: array
          items:
            type: string
            format: email
          description: "Email recipients (email type only)."
        from:
          type: string
          format: email
          description: "Email sender (email type only)."
        enabled:
          type: boolean
          nullable: true
          description: "null or true = enabled. false = disabled."
      required: [type, url]

    PerformanceConfig:
      type: object
      properties:
        enabled:
          type: boolean
        force_disabled:
          type: boolean
          description: "When true, dashboard cannot enable perf on this server."
        cpu_warn_pct:
          type: integer
          description: "Default 70. Set -1 to disable."
        cpu_crit_pct:
          type: integer
          description: "Default 85. Set -1 to disable."
        mem_warn_pct:
          type: integer
          description: "% free memory. Default 20. Set -1 to disable."
        mem_crit_pct:
          type: integer
          description: "% free memory. Default 10. Set -1 to disable."
        input_delay_warn_ms:
          type: integer
          description: "Default 50. Set -1 to disable."
        input_delay_crit_ms:
          type: integer
          description: "Default 100. Set -1 to disable."
        input_delay_percentile:
          type: string
          enum: [p50, p95]
          description: "Which percentile to evaluate for input delay thresholds. Default p95."
        load_alert_delay_sec:
          type: integer
          minimum: 0
          description: "Seconds a CPU/memory metric must breach before alert fires. Default 60."
        input_delay_alert_delay_sec:
          type: integer
          minimum: 0
          description: "Seconds input delay must breach before alert fires. Default 90."
        collect_remotefx:
          type: boolean
        collect_per_session:
          type: boolean
          description: "Default true."
        sample_interval_sec:
          type: integer
          minimum: 10
          maximum: 300
          description: "Default 30."

    SettingsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTarget"
        session_warning_threshold:
          type: integer
          minimum: 0
          maximum: 100
        grace_period:
          type: integer
          minimum: 1
          maximum: 1440
          description: "Minutes."
        performance:
          $ref: "#/components/schemas/PerformanceConfig"

    SettingsUpdate:
      type: object
      description: "All fields are optional. Absent fields are left unchanged."
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTarget"
          nullable: true
          description: "null = no change. Empty array = clear all targets."
        session_warning_threshold:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        grace_period:
          type: integer
          minimum: 1
          maximum: 1440
          nullable: true
        performance:
          $ref: "#/components/schemas/PerformanceConfig"
          nullable: true

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Public endpoint for load balancer probes. Returns aggregate server counts.
      operationId: getHealth
      responses:
        "200":
          description: Dashboard is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
                  servers:
                    type: integer
                  healthy:
                    type: integer
                  grace:
                    type: integer
                  alerting:
                    type: integer
                  offline:
                    type: integer
                    description: "No report in 10 minutes."
                  unknown:
                    type: integer

  /auth/negotiate:
    post:
      tags: [auth]
      summary: SSPI Negotiate authentication
      description: |
        Multi-leg Kerberos/NTLM handshake. Send `Authorization: Negotiate <token>`
        header. The server responds with `WWW-Authenticate: Negotiate <response-token>`
        until the handshake completes. On success, a `drainctl_session` cookie is set.
        Short-circuits to 200 if a valid session cookie is already present.
      operationId: authNegotiate
      security:
        - negotiate: []
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: "DOMAIN\\alice"
        "401":
          description: Handshake in progress or failed.
        "403":
          description: Authenticated but not a member of the required AD group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      summary: Credential login
      description: |
        Validates Windows credentials via LogonUserW. Accepts `DOMAIN\user` or
        `user@domain.com` formats. On success, a `drainctl_session` cookie is set.
        Rate-limited to 5 req/min per IP.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "DOMAIN\\alice"
                password:
                  type: string
                  format: password
              required: [username, password]
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
        "400":
          description: Missing or malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Valid credentials but not in the required AD group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: Invalidates the session and clears the cookie. Idempotent.
      operationId: authLogout
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /me:
    get:
      tags: [auth]
      summary: Session probe
      description: |
        Lightweight check for client-side auth restoration. Returns the
        authenticated username or 401 without a body. Does not set
        WWW-Authenticate (plain fetch only).
      operationId: getMe
      security:
        - session: []
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                    example: "DOMAIN\\alice"
        "401":
          description: Not authenticated.

  /register:
    post:
      tags: [agent]
      summary: Register agent
      description: |
        Agents register before reporting. Machine account must match the
        hostname or be a domain admin. Hostname must be RFC 1123 compliant
        (max 253 characters).
      operationId: registerAgent
      security:
        - machineSSPI: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  example: "RDSH-01"
              required: [hostname]
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tls_fingerprint:
                    type: string
                    description: "SHA-256 fingerprint of the dashboard TLS certificate (if TLS enabled)."
        "400":
          description: Invalid hostname.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Machine account does not match hostname.

  /report:
    post:
      tags: [agent]
      summary: Report server state
      description: |
        Agents post periodic health check results. Host must be pre-registered.
        Machine account must match hostname or be a domain admin. Max body 64 KB.
      operationId: reportState
      security:
        - machineSSPI: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckResult"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid payload or unregistered host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Machine account does not match hostname.

  /config:
    get:
      tags: [agent]
      summary: Get dashboard config (agent)
      description: |
        Same payload as GET /settings but accessible to machine accounts.
        Agents use this to fetch dashboard-managed settings (thresholds,
        notification targets, performance config).
      operationId: getConfig
      security:
        - machineSSPI: []
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"

  /servers:
    get:
      tags: [servers]
      summary: List all servers
      description: Returns all registered servers with current state.
      operationId: listServers
      security:
        - session: []
      responses:
        "200":
          description: Server list (empty array if none registered).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerView"
        "401":
          description: Not authenticated.

  /servers/{host}:
    get:
      tags: [servers]
      summary: Get single server
      description: Returns current state of a registered server.
      operationId: getServer
      security:
        - session: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerView"
        "401":
          description: Not authenticated.
        "404":
          description: Server not found.

    delete:
      tags: [servers]
      summary: Remove server
      description: Removes a server from the dashboard and its history.
      operationId: deleteServer
      security:
        - session: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Not authenticated.
        "404":
          description: Server not found.

  /settings:
    get:
      tags: [settings]
      summary: Get dashboard settings
      description: Returns notification targets, thresholds, and performance config.
      operationId: getSettings
      security:
        - session: []
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: Not authenticated.
        "500":
          description: Failed to load config from disk.

    put:
      tags: [settings]
      summary: Update dashboard settings
      description: |
        Atomic update. Absent fields are left unchanged. Empty notifications
        array clears all targets. Max body 8 KB.
      operationId: updateSettings
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
        "500":
          description: Failed to save config.

  /notify-test:
    post:
      tags: [notifications]
      summary: Test notification
      description: |
        Sends a test notification. If the body contains a NotificationTarget
        (identified by non-empty URL or type "email"), tests that single target.
        Otherwise tests all saved targets.
      operationId: testNotification
      security:
        - session: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTarget"
      responses:
        "200":
          description: Test sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Send failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.

  /events:
    get:
      tags: [servers]
      summary: SSE event stream
      description: |
        Server-Sent Events stream for real-time dashboard updates. Requires a
        valid session cookie. The browser's `EventSource` handles automatic
        reconnection; the server re-validates the session every 5 minutes and
        closes the stream if the session has expired.

        Keepalive comments (`: keepalive`) are sent every 25 seconds to prevent
        intermediate proxies from closing idle connections.

        Each `data:` line is a JSON-encoded `SSEEvent` object:

        ```json
        { "type": "<event-type>", "host": "<hostname>", "data": <payload>, "timestamp": "<RFC3339>" }
        ```

        ### Event types

        **`server_update`** — emitted when a server reports its state. `host`
        is set. `data` is a `ServerView` object (same shape as
        `GET /api/v1/servers` array elements).

        **`server_deleted`** — emitted when a server is removed from the
        dashboard. `host` is set. `data` is:
        ```json
        { "changed_by": "<username>" }
        ```

        **`settings_update`** — emitted when configuration is saved via
        `PUT /api/v1/settings`. `host` is empty. `data` is:
        ```json
        {
          "notifications": [ ...NotificationTarget... ],
          "session_warning_threshold": 80,
          "grace_period": 15,
          "performance": { ...PerformanceConfig... }
        }
        ```
        Note: `secret` fields inside `notifications` are always empty strings
        in this broadcast — secrets are never transmitted over the event stream.
      operationId: streamEvents
      security:
        - session: []
      responses:
        "200":
          description: SSE stream established.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Newline-delimited SSE messages. See endpoint description for
                  event type shapes.
        "401":
          description: Not authenticated.
        "429":
          description: Too many concurrent SSE connections (limit 100).

  /metrics/{host}:
    get:
      tags: [metrics]
      summary: Get per-host time-series metrics
      description: |
        Returns per-counter time-series for a single host at a chosen resolution tier.

        `resolution=auto` picks the coarsest tier yielding ≥ 240 points in the
        window. During the US1 phase the `5min` tier is not yet materialized,
        so `auto` and an explicit `5min` request both degrade to `hourly`; the
        `tier` field in the response always reflects what was actually served
        (FR-019). When the tier holds zero rows for the host+window, the
        response is 200 OK with an empty `series` map and `oldest_available`
        / `newest_available` set to `null` (FR-019a — drives the dashboard's
        "Collecting data…" state).
      operationId: getMetrics
      security:
        - session: []
      parameters:
        - name: host
          in: path
          required: true
          description: "URL-encoded hostname. Must exist in `ServerState` or a 404 is returned."
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: "Inclusive lower bound, ISO-8601 / RFC 3339 UTC."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: "Exclusive upper bound, ISO-8601 / RFC 3339 UTC. Must be > `from`; the window must not exceed 90 days."
          schema:
            type: string
            format: date-time
        - name: resolution
          in: query
          description: "Tier selection."
          schema:
            type: string
            enum: [raw, 5min, hourly, auto]
            default: auto
        - name: counters
          in: query
          description: "Comma-separated counter names (e.g. `cpu_pct,mem_avail_mb`). Unknown names are silently skipped. Defaults to all known counters."
          schema:
            type: string
      responses:
        "200":
          description: Metrics series for the requested window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "400":
          description: "`invalid_range` (unparseable timestamps, `to` ≤ `from`, or window > 90 days) or `invalid_resolution`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
        "404":
          description: "`unknown_host` — host is not registered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "`storage_error` — DB open or query failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit:
    get:
      tags: [audit]
      summary: Query drain-mode audit trail
      description: |
        Time-range query over the audit table with cursor-based pagination. Replaces
        the audit portion of the retired `/api/v1/history/{host}` endpoint.

        `records` are ordered by `ts DESC`. Pagination cursors are bound to the
        filter set (`host`, `actor`, `from`, `to`, `changes_only`); reusing a
        cursor across different filters returns `invalid_cursor` rather than
        silently skipping pages.

        Reconciliation rows (`reconciliation=true`) are synthesized on service
        startup when the registry drain state diverged from the last audit
        record while the service was down (FR-001a). They carry
        `principal=""`, `key_modified_ts=null`, and a populated `before_ts`.
      operationId: queryAudit
      security:
        - session: []
      parameters:
        - name: from
          in: query
          description: "Inclusive lower bound (ISO-8601 UTC). Omit to query from the oldest retained record."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "Exclusive upper bound (ISO-8601 UTC). Must be > `from` when both are set."
          schema:
            type: string
            format: date-time
        - name: host
          in: query
          description: "Filter to one host."
          schema:
            type: string
        - name: actor
          in: query
          description: "Filter to one principal. Matches against `changed_by` (the display actor), not `principal`."
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size (1..5000, default 500). Larger values are clamped."
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: cursor
          in: query
          description: "Opaque pagination cursor; pass verbatim from a previous response's `next_cursor`."
          schema:
            type: string
        - name: changes_only
          in: query
          description: "When true (default, matches CLI), drop no-op records where `prev_state == new_state`."
          schema:
            type: string
            enum: ["0", "1", "true", "false"]
            default: "true"
      responses:
        "200":
          description: Audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResponse"
        "400":
          description: "`invalid_range` (unparseable timestamps or `to` ≤ `from`) or `invalid_cursor` (malformed / filter-bound mismatch)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
        "500":
          description: "`storage_error` — DB open or query failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /maintenance/status:
    get:
      tags: [maintenance]
      summary: Background maintenance job status
      description: |
        Returns the last-run state of every background maintenance job, plus the
        server's current time so clients can compute freshness without trusting
        their own clock.

        Backs the dashboard's maintenance widget (FR-030). Overdue flagging is
        computed server-side: a job is `overdue` when
        `expected_interval_seconds > 0` AND
        `server_time - finished > 2 * expected_interval_seconds` (FR-031).
        One-shot startup jobs (`jsonl_migration`, `drift_reconciliation`) report
        `expected_interval_seconds = 0` and are never overdue.

        Dashboard polling cadence is once per 15 seconds; no dedicated rate-limit
        bucket.
      operationId: getMaintenanceStatus
      security:
        - session: []
      responses:
        "200":
          description: Current job roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatusResponse"
        "401":
          description: Not authenticated.
        "500":
          description: "`storage_error` — DB open, query failure, or config load failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /history/{host}:
    get:
      tags: [history]
      summary: (Removed) Get server history
      deprecated: true
      description: |
        **Deprecated.** The in-memory history ring was removed in v26.107. This
        route now returns `410 Gone` with a body pointing callers to the
        replacement endpoints and is retained for one release to surface the
        migration message; it will be deleted in a follow-up.

        Use [`GET /api/v1/metrics/{host}`](#/metrics/getMetrics) for time-series
        counters and [`GET /api/v1/audit`](#/audit/queryAudit) for drain-mode
        change history.
      x-deprecated: true
      x-replaced-by:
        - /api/v1/metrics/{host}
        - /api/v1/audit
      operationId: getHistory
      security:
        - session: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: "(Ignored — route always returns 410 Gone.)"
          schema:
            type: integer
        - name: changes_only
          in: query
          description: "(Ignored — route always returns 410 Gone.)"
          schema:
            type: string
      responses:
        "410":
          description: |
            Gone. Body carries `{"error":"use /api/v1/metrics/{host} or /api/v1/audit"}`
            to direct clients to the replacement endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
