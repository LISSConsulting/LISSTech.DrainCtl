<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#fdf8f6;font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fdf8f6;min-height:100vh;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- Card -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#fffaf8;border-radius:8px;border-left:5px solid #a3475b;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="padding:28px 32px 0 32px;">

              <!-- Header -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    <p style="margin:0 0 4px 0;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#a3475b;font-variant:small-caps;">DrainCtl</p>
                    <p style="margin:0 0 16px 0;font-size:18px;font-weight:600;color:#2c1810;line-height:1.3;">{{.Subject}}</p>
                    <hr style="border:none;border-top:1px solid #f0e0d8;margin:0 0 20px 0;">
                  </td>
                </tr>
              </table>

              <!-- Status badge -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
                <tr>
                  <td style="background-color:{{.StatusColor}};color:#ffffff;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 14px;border-radius:20px;">
                    {{.Status}}
                  </td>
                </tr>
              </table>

              <!-- Details table -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;border-radius:6px;overflow:hidden;">
                <tr style="background-color:#f5ebe8;">
                  <td style="padding:9px 14px;font-size:12px;font-weight:600;color:#7a5c52;width:36%;text-transform:uppercase;letter-spacing:0.06em;">Server</td>
                  <td style="padding:9px 14px;font-size:14px;color:#2c1810;font-weight:500;">{{.Host}}</td>
                </tr>
                <tr style="background-color:#fffaf8;">
                  <td style="padding:9px 14px;font-size:12px;font-weight:600;color:#7a5c52;text-transform:uppercase;letter-spacing:0.06em;">Mode</td>
                  <td style="padding:9px 14px;font-size:14px;color:#2c1810;">{{.Mode}}</td>
                </tr>
                <tr style="background-color:#f5ebe8;">
                  <td style="padding:9px 14px;font-size:12px;font-weight:600;color:#7a5c52;text-transform:uppercase;letter-spacing:0.06em;">Status</td>
                  <td style="padding:9px 14px;font-size:14px;color:#2c1810;">{{.Status}}</td>
                </tr>
                {{if .Duration}}
                <tr style="background-color:#fffaf8;">
                  <td style="padding:9px 14px;font-size:12px;font-weight:600;color:#7a5c52;text-transform:uppercase;letter-spacing:0.06em;">Duration</td>
                  <td style="padding:9px 14px;font-size:14px;color:#2c1810;">{{.Duration}}</td>
                </tr>
                {{end}}
                <tr style="background-color:{{if .Duration}}#f5ebe8{{else}}#fffaf8{{end}};">
                  <td style="padding:9px 14px;font-size:12px;font-weight:600;color:#7a5c52;text-transform:uppercase;letter-spacing:0.06em;">Changed By</td>
                  <td style="padding:9px 14px;font-size:14px;color:#2c1810;">{{.ChangedBy}}</td>
                </tr>
                <tr style="background-color:{{if .Duration}}#fffaf8{{else}}#f5ebe8{{end}};">
                  <td style="padding:9px 14px;font-size:12px;font-weight:600;color:#7a5c52;text-transform:uppercase;letter-spacing:0.06em;">Timestamp</td>
                  <td style="padding:9px 14px;font-size:14px;color:#2c1810;">{{.Timestamp}}</td>
                </tr>
              </table>

              {{if .Message}}
              <!-- Message blockquote -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="border-left:3px solid #a3475b;padding:10px 14px;background-color:#fdf1ec;border-radius:0 4px 4px 0;">
                    <p style="margin:0;font-size:14px;color:#4a2e22;line-height:1.5;font-style:italic;">{{.Message}}</p>
                  </td>
                </tr>
              </table>
              {{end}}

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 32px 24px 32px;border-top:1px solid #f0e0d8;">
              <p style="margin:0;font-size:11px;color:#b09080;text-align:center;line-height:1.6;">
                Sent by LISSTech DrainCtl &mdash; LISS Technologies<br>
                <span style="color:#c8b0a0;">Event: {{.Trigger}}</span>
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>
</body>
</html>
