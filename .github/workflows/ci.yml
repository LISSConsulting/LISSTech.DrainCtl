name: CI

on:
  pull_request:
    branches: [trunk]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Lint + Test + Vulncheck
    runs-on: windows-latest
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
        shell: pwsh

      - name: Copy frontend dist for Go embed
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue internal/dashboard/dist
          Copy-Item -Recurse frontend/dist internal/dashboard/dist
        shell: pwsh

      - name: Install tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Go vet
        run: go vet ./...

      - name: gofmt check
        shell: pwsh
        run: |
          $unformatted = & gofmt -l . cmd/drainctl/ cmd/cshared/ 2>&1
          if ($unformatted) { Write-Error "gofmt: $unformatted"; exit 1 }

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Go test
        run: go test -p 1 -count=1 ./...

      - name: Vulnerability scan
        run: govulncheck ./...
