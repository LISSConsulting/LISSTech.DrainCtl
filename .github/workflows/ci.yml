name: CI

on:
  push:
    branches: [trunk, development]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install tools
        run: |
          choco install mingw just -y
          dotnet tool install -g wix
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        shell: pwsh

      - name: Lint
        run: just lint
        shell: pwsh

      - name: Build
        run: just all
        shell: pwsh

      - name: Verify version
        run: .\dist\LISSTech.DrainCtl\bin\drainctl.exe --version
        shell: pwsh

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
