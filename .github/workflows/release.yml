name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install tools
        run: |
          choco install mingw just -y
          dotnet tool install -g wix
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        shell: pwsh

      - name: Lint
        run: just lint
        shell: pwsh

      - name: Build
        run: just all
        shell: pwsh

      - name: Get version
        id: version
        run: |
          $v = (.\dist\LISSTech.DrainCtl\bin\drainctl.exe --version 2>&1) -replace 'drainctl version ', ''
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LISSTech.DrainCtl-${{ steps.version.outputs.VERSION }}
          path: |
            dist/LISSTech.DrainCtl.msi
            dist/LISSTech.DrainCtl/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: LISSTech DrainCtl ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/LISSTech.DrainCtl.msi
